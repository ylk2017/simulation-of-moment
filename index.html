<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14273e">
<title>Moments &amp; Equilibrium | 力矩與平衡</title>
<style>
:root {
  color-scheme: light;
  --ink: #14273e;
  --muted: #4b6075;
  --paper: #eef3f8;
  --card: #ffffff;
  --line: #c5d1de;
  --blue: #075fbb;
  --red: #b82236;
  --green: #157442;
  --orange: #bb5700;
  --purple: #7240b3;
  --grey: #616b77;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 16px/1.5 Arial, Helvetica, sans-serif;
}
button, input, select, textarea { font: inherit; }
button, select, input:not([type="checkbox"]):not([type="range"]) {
  min-height: 44px;
}
button {
  padding: 9px 14px;
  border: 1px solid transparent;
  border-radius: 8px;
  color: white;
  background: var(--blue);
  cursor: pointer;
}
button.secondary { background: #e8eef5; color: var(--ink); border-color: var(--line); }
button.warning { background: #8b4700; }
button.success { background: var(--green); }
button:disabled { cursor: not-allowed; opacity: .5; }
button:hover:not(:disabled) { filter: brightness(.94); }
:focus-visible { outline: 3px solid #e88900; outline-offset: 3px; }
input, select, textarea {
  padding: 8px;
  border: 1px solid #8498ae;
  border-radius: 7px;
  background: white;
  color: var(--ink);
}
input[type="number"] { width: 125px; }
input[type="range"] {
  width: 100%;
  min-height: 44px;
  padding: 0;
  accent-color: var(--blue);
}
input[type="checkbox"] { width: 23px; height: 23px; margin: 0; flex-shrink: 0; }
textarea { width: 100%; min-height: 82px; resize: vertical; }
label { cursor: pointer; }
h1 { font-size: 23px; line-height: 1.25; margin: 0; }
h2 { font-size: 21px; margin: 0 0 12px; }
h3 { font-size: 18px; margin: 16px 0 9px; }
p { margin: 9px 0; }
header { background: var(--ink); color: white; padding: 14px 18px 0; }
.header-row, nav, main { max-width: 1800px; margin: auto; }
.header-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.header-row h1 { flex: 1; }
.badge {
  padding: 6px 10px;
  border-radius: 20px;
  color: white;
  background: #355574;
}
nav { display: flex; gap: 8px; margin-top: 13px; overflow-x: auto; }
nav button { border-radius: 8px 8px 0 0; white-space: nowrap; background: #345371; }
nav button[aria-selected="true"] { background: var(--paper); color: var(--ink); }
main { padding: 15px; }
.identity {
  display: flex;
  gap: 15px;
  flex-wrap: wrap;
  align-items: center;
  margin-bottom: 14px;
}
.identity label { display: flex; align-items: center; gap: 8px; }
.identity input { max-width: 210px; }
.layout {
  display: grid;
  grid-template-columns: minmax(0, 1.85fr) minmax(370px, 1fr);
  gap: 16px;
  align-items: start;
}
.card {
  padding: 16px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  margin-bottom: 14px;
  box-shadow: 0 3px 12px #14273e09;
}
.scene-card { position: sticky; top: 12px; padding: 10px; }
.canvas-scroll { overflow: auto; border-radius: 8px; background: #f6faff; }
canvas {
  display: block;
  width: 100%;
  min-width: 720px;
  height: 630px;
  touch-action: none;
  background: #f6faff;
}
.legend { display: flex; flex-wrap: wrap; gap: 8px 15px; margin: 12px 4px; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.swatch { display: inline-block; width: 16px; height: 16px; border-radius: 3px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; margin: 10px 0; }
.row .grow { flex: 1; min-width: 100px; }
.check { display: flex; gap: 9px; align-items: center; min-height: 44px; }
.field { display: block; margin: 10px 0 6px; font-weight: 700; }
.question {
  padding: 12px;
  border-left: 5px solid var(--blue);
  border-radius: 6px;
  background: #edf5ff;
}
.note { color: var(--muted); }
.banner {
  padding: 12px;
  border-radius: 8px;
  background: #eaf0f6;
  margin: 12px 0;
}
.banner.good { background: #e0f3e7; color: #085a30; }
.banner.caution { background: #fff0d6; color: #754000; }
.banner.bad { background: #ffe7eb; color: #951426; }
.feedback { min-height: 26px; margin: 8px 0; }
.feedback.good { color: #08602d; }
.feedback.bad { color: #9b182c; }
.step { border-top: 1px solid var(--line); margin-top: 17px; padding-top: 6px; }
.choices { display: flex; gap: 8px; flex-wrap: wrap; }
.choices label {
  padding: 7px 10px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: #f5f8fc;
}
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
.stat { background: #f0f5fa; border-radius: 7px; padding: 10px; }
.stat span { display: block; }
.track {
  height: 24px;
  position: relative;
  background: #e6ecf2;
  border: 1px solid #9fadc0;
  border-radius: 5px;
  margin: 8px 0 4px;
  overflow: hidden;
}
.fill { height: 100%; min-width: 0; }
.limit-line { position: absolute; top: 0; bottom: 0; width: 3px; background: #14273e; }
.bar-label { display: flex; justify-content: space-between; gap: 10px; }
.hidden { display: none !important; }
.modal {
  position: fixed; inset: 0;
  display: grid; place-items: center;
  padding: 16px;
  z-index: 100;
  background: #14273ebd;
}
.dialog {
  max-width: 980px; width: 100%; max-height: 92vh;
  overflow: auto;
  background: white;
  border-radius: 12px;
  padding: 20px;
}
.dialog-top { display: flex; gap: 12px; align-items: center; justify-content: space-between; }
#configEditor { min-height: 310px; font-family: ui-monospace, Menlo, Consolas, monospace; }
.solution { white-space: pre-wrap; background: #f1f5f9; padding: 15px; border-radius: 8px; }
#copyText { min-height: 290px; }
details { margin: 12px 0; }
summary { cursor: pointer; min-height: 44px; padding: 8px; }
@media (max-width: 1150px) {
  .layout { grid-template-columns: 1fr; }
  .scene-card { position: static; }
  canvas { height: 590px; }
}
@media (max-width: 620px) {
  main { padding: 9px; }
  header { padding: 11px 10px 0; }
  h1 { font-size: 20px; }
  .card { padding: 12px; }
  .scene-card { padding: 5px; }
  .stats { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
}
</style>
</head>
<body>
<header>
  <div class="header-row">
    <h1>Moments &amp; Equilibrium | 力矩與平衡</h1>
    <span id="modeBadge" class="badge"></span>
    <button id="languageButton" class="secondary" type="button" aria-label="Change language"></button>
    <button id="teacherButton" class="secondary" type="button" aria-label="Open teacher panel">⚙</button>
  </div>
  <nav role="tablist" aria-label="Physics tasks">
    <button id="tab1" role="tab" aria-selected="true" aria-controls="task1" type="button"></button>
    <button id="tab2" role="tab" aria-selected="false" aria-controls="task2" type="button"></button>
  </nav>
</header>

<main>
  <div class="identity">
    <label><span id="nameLabel"></span><input id="studentName" autocomplete="name" aria-label="Student name"></label>
    <label><span id="classLabel"></span><input id="studentClass" aria-label="Class"></label>
    <span id="gravityBadge" class="badge"></span>
  </div>
  <div class="layout">
    <section class="card scene-card">
      <div class="canvas-scroll">
        <canvas id="scene" tabindex="0" aria-label="Interactive physics diagram"></canvas>
      </div>
      <div id="legend" class="legend"></div>
      <p id="sceneHelp" class="note"></p>
      <div id="sceneStatus" class="banner" role="status" aria-live="polite"></div>
    </section>
    <div id="taskHost"></div>
  </div>
</main>

<div id="teacherModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="teacherTitle">
  <section class="dialog">
    <div class="dialog-top">
      <h2 id="teacherTitle"></h2>
      <button id="closeTeacher" class="secondary" type="button" aria-label="Close teacher panel">✕</button>
    </div>
    <div id="pinSection">
      <label class="field" for="pinInput" id="pinLabel"></label>
      <div class="row">
        <input id="pinInput" type="password" autocomplete="off" aria-label="Teacher PIN">
        <button id="unlockTeacher" type="button"></button>
      </div>
      <p id="pinFeedback" role="status"></p>
    </div>
    <div id="teacherContent" class="hidden">
      <div id="quickControls"></div>
      <label id="configLabel" class="field" for="configEditor"></label>
      <textarea id="configEditor" spellcheck="false" aria-label="Complete editable CONFIG JSON"></textarea>
      <div class="row">
        <button id="applyConfig" type="button"></button>
        <button id="revealSolutions" class="secondary" type="button"></button>
        <button id="exportResults" class="success" type="button"></button>
        <button id="runTests" class="secondary" type="button"></button>
      </div>
      <p id="teacherFeedback" role="status"></p>
      <div id="workedSolutions" class="solution hidden"></div>
    </div>
  </section>
</div>

<div id="copyModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="copyTitle">
  <section class="dialog">
    <div class="dialog-top">
      <h2 id="copyTitle"></h2>
      <button id="closeCopy" class="secondary" type="button" aria-label="Close copy text">✕</button>
    </div>
    <p id="copyMessage"></p>
    <textarea id="copyText" spellcheck="false" aria-label="Selectable text to copy"></textarea>
    <button id="selectCopy" class="secondary" type="button"></button>
  </section>
</div>

<script>
"use strict";

/* Edit classroom parameters here, or edit this complete object in ⚙ Teacher. */
let CONFIG = {
  language: "en",
  mode: "assessment",
  g: 9.81,
  gravityChoices: [9.81, 10],
  showReadouts: true,
  showSafeZone: false,
  teacherPIN: "",
  grading: {
    relativeTolerance: 0.01,
    absoluteTolerance: 0.000001,
    significantFigures: 3
  },
  rod: {
    length: 2.00,
    pivotMark: 1.00,
    fulcrumHeight: 0.15,
    minorTick: 0.05,
    labelTick: 0.10
  },
  task1: {
    fixedMass: 2.0,
    fixedMark: 1.50,
    leftDistance: 0.40,
    rodMass: 0,
    rodWeightInitiallyOn: false,
    massMin: 0,
    massMax: 20,
    massStep: 0.01,
    massButtonStep: 0.10,
    distanceMin: 0.05,
    distanceMax: 1.00,
    distanceStep: 0.05,
    lockUntilPredict: true,
    maxAttempts: 3,
    challengeDistances: [0.25, 0.40, 0.50, 0.80, 1.00]
  },
  task2: {
    cableA: 0.40,
    cableB: 1.80,
    Tmax: 500,
    warningFraction: 0.80,
    workerMass: 60,
    workerStart: 1.00,
    workerStep: 0.01,
    workerLargeStep: 0.10,
    rodMass: 0,
    rodMassMin: 0,
    rodMassMax: 20,
    rodMassStep: 0.10
  },
  animation: {
    tippingSeconds: 0.60,
    holdSeconds: 0.35,
    shakeAmplitude: 4,
    shakeFrequency: 8
  },
  drawing: {
    minimumCanvasWidth: 720,
    maximumArrowLength: 145,
    desiredPixelsPerNewton: 0.75,
    momentArcRadius: 42,
    colours: {
      weight: "#b82236",
      tension: "#075fbb",
      ground: "#157442",
      pivot: "#616b77",
      clockwise: "#bb5700",
      anticlockwise: "#7240b3",
      ink: "#14273e"
    }
  }
};

const $ = id => document.getElementById(id);
const canvas = $("scene");
const ctx = canvas.getContext("2d");
const schema = JSON.parse(JSON.stringify(CONFIG));
const state = {
  task: 1,
  mass: CONFIG.task1.massMin,
  distance: CONFIG.task1.leftDistance,
  rodWeight: CONFIG.task1.rodWeightInitiallyOn,
  workerX: CONFIG.task2.workerStart,
  platformMass: CONFIG.task2.rodMass,
  predictionSubmitted: false,
  predictionCorrect: false,
  attempts: 0,
  allPredictionAttempts: 0,
  challenges: 0,
  finalSubmitted: false,
  safeRequested: CONFIG.showSafeZone,
  teacherSafeOverride: false,
  stepAttempts: Array(7).fill(0),
  stepResults: Array(7).fill(null),
  form: {},
  feedback1: "",
  feedback1Good: false,
  angle: Math.asin(CONFIG.rod.fulcrumHeight / (CONFIG.rod.length - CONFIG.rod.pivotMark)),
  motion: null,
  holdUntil: 0,
  drag: null,
  teacherUnlocked: false,
  time: [0, 0],
  lastTime: performance.now(),
  width: 0,
  height: 0,
  dpr: 0,
  geometry: null,
  returnFocus: null
};
const tr = (en, zh) => CONFIG.language === "zh" ? zh : en;
const esc = value => String(value).replace(/[&<>"']/g, c => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
}[c]));
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const snap = (x, step) => Math.round(x / step) * step;
const centre = () => CONFIG.rod.length / 2;
function fmt(n) {
  if (!Number.isFinite(n)) return "—";
  if (Math.abs(n) < 1e-10) n = 0;
  return n.toPrecision(CONFIG.grading.significantFigures);
}
const mark = n => Number(n).toFixed(2);
const unit = (n, u) => `${fmt(n)} ${u}`;
function closeNumber(value, expected) {
  if (String(value).trim() === "") return false;
  const n = Number(value);
  return Number.isFinite(n) &&
    Math.abs(n - expected) <= Math.max(
      CONFIG.grading.absoluteTolerance,
      Math.abs(expected) * CONFIG.grading.relativeTolerance
    );
}
function allowedReadouts() {
  return CONFIG.showReadouts &&
    (state.task !== 1 || state.predictionSubmitted || !CONFIG.task1.lockUntilPredict);
}
function canExplore1() {
  return state.predictionSubmitted || !CONFIG.task1.lockUntilPredict;
}
function captureForm() {
  document.querySelectorAll("#taskHost input, #taskHost select, #taskHost textarea").forEach(el => {
    if (!el.id || el.dataset.sim === "true") return;
    state.form[el.id] = el.type === "checkbox" ? el.checked : el.value;
  });
}
function restoreForm() {
  Object.entries(state.form).forEach(([id, value]) => {
    const el = $(id);
    if (!el) return;
    if (el.type === "checkbox") el.checked = !!value;
    else el.value = value;
  });
}
function value(id) {
  const el = $(id);
  return el ? el.value : (state.form[id] || "");
}
function checked(id) {
  return $(id) ? $(id).checked : !!state.form[id];
}
function numField(id, label, units = "", step = "any") {
  return `<label class="row">${label}
    <input id="${id}" type="number" step="${step}" aria-label="${esc(label)}">
    ${units}</label>`;
}
function workField(n) {
  return `<label class="field" for="work${n}">${tr("Your working", "你的計算過程")}</label>
    <textarea id="work${n}" aria-label="${esc(tr("Working for step ", "步驟計算過程 ") + n)}"></textarea>`;
}
function stepButton(n) {
  return `<button type="button" data-action="check-step" data-step="${n}">${tr("Check step", "檢查步驟")}</button>
    <div id="feedback${n}" class="feedback" aria-live="polite"></div>`;
}

function seesawPhysics(cfg = CONFIG, mass = state.mass, distance = state.distance, includeRod = state.rodWeight) {
  const r = cfg.rod, t = cfg.task1;
  const dR = t.fixedMark - r.pivotMark;
  const gramsL = Math.round(mass * 1000);
  const gramsR = Math.round(t.fixedMass * 1000);
  const cmL = Math.round(distance * 100);
  const cmR = Math.round(dR * 100);
  const integerDifference = gramsL * cmL - gramsR * cmR;
  const sign = Math.sign(integerDifference);
  const acw = mass * cfg.g * distance;
  const cw = t.fixedMass * cfg.g * dR;
  const loadNet = acw - cw;
  const endArm = sign > 0 ? r.pivotMark : r.length - r.pivotMark;
  const R = sign === 0 ? 0 : Math.abs(loadNet) / endArm;
  const rodMass = includeRod ? t.rodMass : 0;
  const P = (mass + t.fixedMass + rodMass) * cfg.g - R;
  return {
    sign, acw, cw, loadNet, R, P, rodMass,
    maximum: t.fixedMass * dR / distance,
    groundSide: sign > 0 ? "left" : sign < 0 ? "right" : "none",
    target: sign > 0
      ? -Math.asin(r.fulcrumHeight / r.pivotMark)
      : Math.asin(r.fulcrumHeight / (r.length - r.pivotMark))
  };
}

function platformPhysics(cfg = CONFIG, x = state.workerX, rodMass = state.platformMass) {
  const t = cfg.task2, C = cfg.rod.length / 2, D = t.cableB - t.cableA;
  const W = t.workerMass * cfg.g, Wr = rodMass * cfg.g;
  const TB = (W * (x - t.cableA) + Wr * (C - t.cableA)) / D;
  const TA = W + Wr - TB;
  const a = Math.abs(TA) < 1e-9 ? 0 : TA;
  const b = Math.abs(TB) < 1e-9 ? 0 : TB;
  const actualA = Math.max(0, a), actualB = Math.max(0, b);
  const netForce = actualA + actualB - W - Wr;
  const netMoment = actualB * D - W * (x - t.cableA) - Wr * (C - t.cableA);
  return {
    W, Wr, D, TA: a, TB: b, actualA, actualB, netForce, netMoment,
    slackA: a < 0, slackB: b < 0,
    overloadA: a > t.Tmax + 1e-9,
    overloadB: b > t.Tmax + 1e-9
  };
}

function safeZone(cfg = CONFIG, rodMass = state.platformMass) {
  const t = cfg.task2, L = cfg.rod.length, C = L / 2, D = t.cableB - t.cableA;
  const W = t.workerMass * cfg.g, Wr = rodMass * cfg.g, total = W + Wr;
  const lowerTB = Math.max(0, total - t.Tmax);
  const upperTB = Math.min(t.Tmax, total);
  const rawMin = t.cableA + (lowerTB * D - Wr * (C - t.cableA)) / W;
  const rawMax = t.cableA + (upperTB * D - Wr * (C - t.cableA)) / W;
  const min = Math.max(0, rawMin), max = Math.min(L, rawMax);
  const exists = lowerTB <= upperTB + 1e-9 && min <= max + 1e-9;
  const rightOverloadMark = t.cableA + (t.Tmax * D - Wr * (C - t.cableA)) / W;
  const leftOverloadMark = t.cableB - (t.Tmax * D - Wr * (t.cableB - C)) / W;
  const leftDistance = exists ? Math.abs(min - C) : NaN;
  const rightDistance = exists ? Math.abs(max - C) : NaN;
  const maximum = exists ? Math.max(leftDistance, rightDistance) : NaN;
  let direction = "none";
  if (exists) {
    if (Math.abs(leftDistance - rightDistance) < 1e-9) direction = "either";
    else {
      const extreme = rightDistance > leftDistance ? max : min;
      direction = extreme >= C ? "B" : "A";
    }
  }
  return {
    exists, min, max, rawMin, rawMax,
    W, Wr, D, C, lowerTB, upperTB,
    rightOverloadMark, leftOverloadMark,
    leftDistance, rightDistance, maximum, direction
  };
}

function question1() {
  const t = CONFIG.task1, dR = t.fixedMark - CONFIG.rod.pivotMark;
  return tr(
    `A ${fmt(t.fixedMass)} kg mass is fixed ${fmt(dR)} m to the right of the pivot. A mass is hung on the left, ${fmt(state.distance)} m from the pivot. Find the maximum mass that can be hung on the left before the seesaw tips.`,
    `一個 ${fmt(t.fixedMass)} kg 質量固定在支點右方 ${fmt(dR)} m。另一質量懸掛於支點左方 ${fmt(state.distance)} m。求蹺蹺板翻倒前左方可懸掛的最大質量。`
  );
}
function question2() {
  const t = CONFIG.task2;
  const platform = state.platformMass === 0
    ? tr("a light platform", "輕平台")
    : tr(`a uniform platform of mass ${fmt(state.platformMass)} kg`, `質量為 ${fmt(state.platformMass)} kg 的均勻平台`);
  return tr(
    `A ${fmt(t.workerMass)} kg worker stands on ${platform}, ${fmt(CONFIG.rod.length)} m long. Cable A is at the ${mark(t.cableA)} m mark and cable B at the ${mark(t.cableB)} m mark. Each cable can hold at most ${fmt(t.Tmax)} N. Find the maximum distance from the platform's centre at which the worker can stand safely. State which cable limits the position on each side.`,
    `一名 ${fmt(t.workerMass)} kg 工人站在長 ${fmt(CONFIG.rod.length)} m 的${platform}上。纜索 A 位於 ${mark(t.cableA)} m 刻度，纜索 B 位於 ${mark(t.cableB)} m 刻度。每條纜索最多承受 ${fmt(t.Tmax)} N。求工人安全站立時離平台中心的最大距離，並指出兩側的限制纜索。`
  );
}

function renderUI() {
  captureForm();
  document.documentElement.lang = CONFIG.language === "zh" ? "zh-Hant" : "en";
  $("languageButton").textContent = CONFIG.language === "en" ? "繁體中文" : "English";
  $("teacherButton").textContent = tr("⚙ Teacher", "⚙ 教師");
  $("modeBadge").textContent = CONFIG.mode === "assessment" ? tr("Assessment", "評估模式") : tr("Sandbox", "沙盒模式");
  $("tab1").textContent = tr("Task 1 – Seesaw (No AI 🚫🤖)", "任務 1 — 蹺蹺板（禁用 AI 🚫🤖）");
  $("tab2").textContent = tr("Task 2 – Suspended Platform (AI step-check 🤖✅)", "任務 2 — 吊船（可用 AI 檢查步驟 🤖✅）");
  $("nameLabel").textContent = tr("Student name", "學生姓名");
  $("classLabel").textContent = tr("Class", "班別");
  $("gravityBadge").textContent = `g = ${CONFIG.g} N kg⁻¹`;
  const c = CONFIG.drawing.colours;
  $("legend").innerHTML = [
    [c.weight, tr("↓ Weight", "↓ 重量")],
    [c.tension, tr("↑ Tension", "↑ 張力")],
    [c.ground, tr("↑ Ground normal reaction", "↑ 地面法向反作用力")],
    [c.pivot, tr("↑ Pivot reaction", "↑ 支點反作用力")],
    [c.clockwise, tr("↻ Clockwise moment", "↻ 順時針力矩")],
    [c.anticlockwise, tr("↺ Anticlockwise moment", "↺ 逆時針力矩")]

function bar(label, valueN, maxN, colour, status, limitN = null) {
  const width = clamp(valueN / maxN * 100, 0, 100);
  const limit = limitN === null ? "" : `<i class="limit-line" style="left:${clamp(limitN / maxN * 100, 0, 99.4)}%"></i>`;
  return `<div class="bar-label"><span>${label}: ${unit(valueN, "N")}</span><span>${status}</span></div>
    <div class="track"><div class="fill" style="width:${width}%;background:${colour}"></div>${limit}</div>`;
}
function momentBar(label, moment, maximum, colour) {
  return `<div>${label}: ${unit(moment, "N m")}</div>
    <div class="track"><div class="fill" style="width:${clamp(moment / maximum * 100, 0, 100)}%;background:${colour}"></div></div>`;
}
function tensionStatus(tension) {
  if (tension < 0) return { text: tr("∿ Slack / cannot push", "∿ 鬆弛／不能推"), colour: CONFIG.drawing.colours.blue || CONFIG.drawing.colours.tension };
  if (tension > CONFIG.task2.Tmax + 1e-9) return { text: tr("✖ Overloaded", "✖ 超載"), colour: CONFIG.drawing.colours.weight };
  if (tension > CONFIG.task2.warningFraction * CONFIG.task2.Tmax) return { text: tr("⚠ Near limit", "⚠ 接近上限"), colour: CONFIG.drawing.colours.clockwise };
  return { text: tr("✔ Within limit", "✔ 未超上限"), colour: CONFIG.drawing.colours.ground };
}
function task1Status() {
  const p = seesawPhysics();
  if (!canExplore1()) return { text: tr("🔒 Predict first. Numerical force and moment readouts are hidden.", "🔒 請先預測。力和力矩的數值讀數已隱藏。"), cls: "caution" };
  if (p.sign === 0) return { text: tr("✅ On the point of tipping — this is the maximum mass. R = 0; the rod stays at its current angle.", "✅ 正處於翻倒臨界點 — 這就是最大質量。R = 0；桿保持目前角度。"), cls: "good" };
  if (p.sign > 0) return { text: tr("✖ Tipped! The left end comes to rest on the ground.", "✖ 已翻倒！左端最終接觸地面。"), cls: "bad" };
  return { text: tr("✔ The right end rests on the ground.", "✔ 右端接觸地面。"), cls: "caution" };
}
function task2Status() {
  const p = platformPhysics(), notices = [];
  if (p.slackA || p.slackB) notices.push(tr(
    `∿ Platform tips — cable ${p.slackA ? "A" : "B"} cannot push!`,
    `∿ 平台翻倒 — 纜索 ${p.slackA ? "A" : "B"} 不能推！`
  ));
  if (p.overloadA) notices.push(tr("✖ Cable A overloaded!", "✖ 纜索 A 超載！"));
  if (p.overloadB) notices.push(tr("✖ Cable B overloaded!", "✖ 纜索 B 超載！"));
  if (notices.length) return { text: notices.join(" "), cls: "bad" };
  if (Math.max(p.TA, p.TB) > CONFIG.task2.warningFraction * CONFIG.task2.Tmax)
    return { text: tr("⚠ Equilibrium, but a cable is near its limit.", "⚠ 處於平衡，但纜索接近上限。"), cls: "caution" };
  return { text: tr("✅ Safe equilibrium: both force and moment balance.", "✅ 安全平衡：合力與合力矩均為零。"), cls: "good" };
}
function zoneVisible() {
  return state.teacherSafeOverride ||
    (state.safeRequested && (CONFIG.mode === "sandbox" || state.finalSubmitted));
}
function updateUI() {

  const p1 = seesawPhysics(), colours = CONFIG.drawing.colours;

          <span>${unit(Math.abs(p1.loadNet), "N m")} ${p1.sign > 0 ? tr("anticlockwise", "逆時針") : p1.sign < 0 ? tr("clockwise", "順時針") : ""}</span></div>
        <div class="stat">R <span>${unit(p1.R, "N")}</span></div>
      </div>
      <p class="note">${tr(
        "When an end is resting on the ground, its reaction supplies the opposing moment; the total moment is then zero.",

  const p2 = platformPhysics(), t2 = CONFIG.task2;

  $("tensionPanel").innerHTML = tensionHTML;

function beginTip() {
  const p = seesawPhysics();
  if (p.sign === 0) { state.motion = null; return; }
  state.motion = {
    from: state.angle, to: p.target,
    start: performance.now(), duration: CONFIG.animation.tippingSeconds * 1000
  };
}
function setMass(m) {

  if (state.motion) {
    const f = clamp((now - state.motion.start) / state.motion.duration, 0, 1);
    const ease = f * f * (3 - 2 * f);

function requiredShape(candidate, example, path = "CONFIG") {
  if (Array.isArray(example)) {
    if (!Array.isArray(candidate) || !candidate.length) throw Error(`${path}: a non-empty array is required.`);
    candidate.forEach(n => { if (!Number.isFinite(n)) throw Error(`${path}: numeric array required.`); });
  } else if (example && typeof example === "object") {
    if (!candidate || typeof candidate !== "object" || Array.isArray(candidate)) throw Error(`${path}: object required.`);
    for (const key of Object.keys(example)) requiredShape(candidate[key], example[key], `${path}.${key}`);
  } else if (typeof candidate !== typeof example || (typeof candidate === "number" && !Number.isFinite(candidate))) {
    throw Error(`${path}: expected ${typeof example}.`);
  }
}
function validateConfig(c) {
  requiredShape(c, schema);
  const assert = (ok, message) => { if (!ok) throw Error(message); };
  const multiple = (n, scale) => Math.abs(n * scale - Math.round(n * scale)) < 1e-6;
  assert(["en", "zh"].includes(c.language), 'language must be "en" or "zh".');
  assert(["assessment", "sandbox"].includes(c.mode), 'mode must be "assessment" or "sandbox".');
  assert(c.g > 0 && c.gravityChoices.every(g => g > 0), "Gravity must be positive.");
  assert(c.grading.relativeTolerance > 0 && c.grading.relativeTolerance < .2, "Invalid grading tolerance.");
  assert(c.grading.absoluteTolerance >= 0, "Absolute tolerance must be non-negative.");
  assert(Number.isInteger(c.grading.significantFigures) && c.grading.significantFigures >= 1 &&
    c.grading.significantFigures <= 10, "Significant figures must be an integer from 1 to 10.");
  const r = c.rod, a = c.task1, b = c.task2;
  assert(r.length > 0 && r.length <= 10, "Rod length must be positive and at most 10 m.");
  assert(Math.abs(r.pivotMark - r.length / 2) < 1e-9, "Uniform-rod zero-moment model requires the pivot at the rod centre.");
  assert(r.fulcrumHeight > 0 && r.fulcrumHeight < r.length / 2, "Fulcrum height must be less than half the rod length.");
  assert(r.minorTick > 0 && r.labelTick >= r.minorTick && r.length / r.minorTick <= 200,
    "Invalid ruler spacing; use at most 200 ticks.");
  assert(multiple(r.labelTick / r.minorTick, 1), "Label spacing must be a multiple of minor-tick spacing.");
  assert(a.fixedMass >= 0 && a.rodMass >= 0 && a.fixedMark > r.pivotMark && a.fixedMark <= r.length,
    "Fixed load must be non-negative and to the right of the pivot.");
  assert(a.massMin >= 0 && a.massMax > a.massMin && a.massStep > 0 && a.massButtonStep > 0,
    "Invalid left-mass range.");
  assert(a.distanceMin > 0 && a.distanceMax <= r.pivotMark &&
    a.distanceMax >= a.distanceMin && a.distanceStep > 0,
    "Invalid left-distance range.");
  assert(a.leftDistance >= a.distanceMin && a.leftDistance <= a.distanceMax, "Default left distance is outside its range.");
  assert(a.challengeDistances.every(d => d >= a.distanceMin && d <= a.distanceMax),
    "Challenge distances must lie in the permitted distance range.");
  assert([r.pivotMark, a.fixedMark, a.leftDistance, a.distanceMin, a.distanceMax, a.distanceStep,
    ...a.challengeDistances].every(n => multiple(n, 100)),
    "Task 1 distances must be whole centimetres for integer moment comparison.");
  assert([a.fixedMass, a.massMin, a.massMax, a.massStep, a.massButtonStep].every(n => multiple(n, 1000)),
    "Task 1 masses must be whole grams for integer moment comparison.");
  assert(Number.isInteger(a.maxAttempts) && a.maxAttempts >= 1, "maxAttempts must be a positive integer.");
  assert(b.cableA >= 0 && b.cableA < b.cableB && b.cableB <= r.length, "Cable marks must satisfy 0 ≤ A < B ≤ rod length.");
  assert(b.Tmax > 0 && b.workerMass > 0 && b.rodMass >= 0, "Invalid cable capacity or masses.");
  assert(b.warningFraction > 0 && b.warningFraction < 1, "Warning fraction must lie between 0 and 1.");
  assert(b.workerStart >= 0 && b.workerStart <= r.length && b.workerStep > 0 && b.workerLargeStep > 0,
    "Invalid worker position or steps.");
  assert(b.rodMassMin >= 0 && b.rodMassMax >= b.rodMassMin && b.rodMassStep > 0, "Invalid platform-mass slider.");
  assert(c.animation.tippingSeconds > 0 && c.animation.holdSeconds >= 0 &&
    c.animation.shakeAmplitude >= 0 && c.animation.shakeFrequency >= 0, "Invalid animation settings.");
  assert(c.drawing.minimumCanvasWidth >= 600 && c.drawing.maximumArrowLength > 0 &&
    c.drawing.desiredPixelsPerNewton > 0 && c.drawing.momentArcRadius > 0, "Invalid drawing settings.");
  for (const colour of Object.values(c.drawing.colours))
    assert(/^#[0-9a-f]{6}$/i.test(colour), "Drawing colours must use six-digit hexadecimal notation.");
}

  c.rod.length = 2; c.rod.pivotMark = 1; c.rod.fulcrumHeight = .15;
  c.task1.fixedMass = 2; c.task1.fixedMark = 1.5;
  c.task2.cableA = .4; c.task2.cableB = 1.8; c.task2.Tmax = 500; c.task2.workerMass = 60;
  const tests = [];
  const test = (name, actual, expected, tolerance = 1e-9) => {
    tests.push({ name, actual, expected, pass: Math.abs(actual - expected) <= tolerance });
  };
  test("Task 1: d_L = 0.40, maximum mass", seesawPhysics(c, 0, .4, false).maximum, 2.5);
  test("Task 1: d_L = 0.25, maximum mass", seesawPhysics(c, 0, .25, false).maximum, 4);
  test("Task 1: d_L = 1.00, maximum mass", seesawPhysics(c, 0, 1, false).maximum, 1);
  test("Task 1: 2.50 kg balances", seesawPhysics(c, 2.5, .4, false).sign, 0);
  test("Task 1: 2.50 kg reaction", seesawPhysics(c, 2.5, .4, false).R, 0);
  test("Task 1: 2.51 kg tips anticlockwise", seesawPhysics(c, 2.51, .4, false).sign, 1);
  test("Task 1: zero left mass reaction", seesawPhysics(c, 0, .4, false).R, 9.81);
  let p = platformPhysics(c, 1, 0), z = safeZone(c, 0);
  test("Task 2: worker weight", p.W, 588.6);
  test("Task 2: centre T_A, 3 s.f.", Number(p.TA.toPrecision(3)), 336);
  test("Task 2: centre T_B, 3 s.f.", Number(p.TB.toPrecision(3)), 252);
  test("Task 2: right limit, 3 decimal places", Number(z.max.toFixed(3)), 1.589);
  test("Task 2: left limit, 3 decimal places", Number(z.min.toFixed(3)), .611);
  test("Task 2: maximum distance, 3 s.f.", Number(z.maximum.toPrecision(3)), .589);
  test("Task 2: right limiting tension", platformPhysics(c, z.max, 0).TB, 500);
  test("Task 2: left limiting tension", platformPhysics(c, z.min, 0).TA, 500);
  p = platformPhysics(c, .3, 0);
  test("Task 2: 0.30 m has slack B", p.slackB ? 1 : 0, 1);
  test("Task 2: 0.30 m also overloads A", p.overloadA ? 1 : 0, 1);
  c.g = 10; z = safeZone(c, 0);
  test("Task 2: g=10, worker weight", platformPhysics(c, 1, 0).W, 600);
  test("Task 2: g=10, right limit", Number(z.max.toFixed(3)), 1.567);
  test("Task 2: g=10, left limit", Number(z.min.toFixed(3)), .633);
  z = safeZone(c, 10);
  test("Task 2: 10 kg platform, left limit", Number(z.min.toFixed(3)), .767);
  test("Task 2: 10 kg platform, right limit", Number(z.max.toFixed(3)), 1.467);
  return tests;
}

document.addEventListener("click", e => {
  const button = e.target.closest("button");
  if (!button) return;
  switch (button.id) {
    case "tab1": state.task = 1; updateUI(); return;
    case "tab2": state.task = 2; updateUI(); return;
    case "languageButton":
      CONFIG.language = CONFIG.language === "en" ? "zh" : "en"; renderUI(); return;
    case "teacherButton": openTeacher(); return;
    case "closeTeacher":
      $("teacherModal").classList.add("hidden");
      $("teacherButton").focus(); return;
    case "unlockTeacher":
      if ($("pinInput").value === CONFIG.teacherPIN) {
        state.teacherUnlocked = true;
        $("pinSection").classList.add("hidden");
        $("teacherContent").classList.remove("hidden");
        $("configEditor").focus();
      } else $("pinFeedback").textContent = tr("❌ Incorrect PIN.", "❌ PIN 不正確。");
      return;
    case "applyConfig": applyConfig(); return;
    case "revealSolutions":
      $("workedSolutions").textContent = solution1() + "\n\n" + solution2();
      $("workedSolutions").classList.remove("hidden"); return;
    case "exportResults": copyOutput(resultsText(), tr("Results for Classroom / Teams", "Classroom／Teams 結果文字")); return;
    case "runTests": {
      const tests = acceptanceTests();
      const passed = tests.filter(t => t.pass).length;
      $("workedSolutions").textContent = `${passed}/${tests.length} ${tr("tests passed", "測試通過")}\n\n` +
        tests.map(t => `${t.pass ? "✅" : "❌"} ${t.name}: ${t.actual}`).join("\n");
      $("workedSolutions").classList.remove("hidden"); return;
    }
    case "closeCopy":
      $("copyModal").classList.add("hidden");
      if (state.returnFocus && state.returnFocus.isConnected) state.returnFocus.focus();
      return;
    case "selectCopy": $("copyText").focus(); $("copyText").select(); return;
  }
  switch (button.dataset.action) {
    case "predict": submitPrediction(); break;
    case "mass-minus": setMass(state.mass - CONFIG.task1.massButtonStep); break;
    case "mass-plus": setMass(state.mass + CONFIG.task1.massButtonStep); break;
    case "release":
      if (!canExplore1()) break;
      state.angle = 0; state.motion = null;
      state.holdUntil = performance.now() + CONFIG.animation.holdSeconds * 1000;
      break;
    case "challenge": challenge(); break;
    case "solution1":
      if (state.attempts >= CONFIG.task1.maxAttempts) {
        $("studentSolutionText").textContent = solution1();
        $("studentSolutionText").classList.remove("hidden");
      }
      break;
    case "reset-worker": setWorker(CONFIG.task2.workerStart); break;
    case "check-step": checkStep(Number(button.dataset.step)); break;
    case "copy-ai": copyOutput(assembleAIPrompt(), tr("Prompt for AI step checker", "AI 步驟檢查提示")); break;
  }
});
document.addEventListener("input", e => {
  switch (e.target.id) {
    case "massRange": setMass(Number(e.target.value)); break;
    case "distanceRange": setDistance(Number(e.target.value)); break;
    case "workerRange": setWorker(Number(e.target.value)); break;
    case "platformMass":
      captureForm();
      state.platformMass = Number(e.target.value);
      invalidateSteps();
      renderUI();
      break;
  }
});
document.addEventListener("change", e => {
  switch (e.target.id) {
    case "massNumber":
      if (e.target.value.trim() !== "") setMass(Number(e.target.value));
      updateUI(); break;
    case "rodWeight": state.rodWeight = e.target.checked; updateUI(); break;
    case "safeToggle": state.safeRequested = e.target.checked; updateUI(); break;
    case "teacherG":
      CONFIG.g = Number(e.target.value);
      state.predictionCorrect = false;
      invalidateSteps();
      renderUI();
      $("configEditor").value = JSON.stringify(CONFIG, null, 2);
      $("teacherFeedback").textContent = tr("Gravity changed. Recheck each step using the new g.", "g 已改變。請用新的 g 重新檢查各步。");
      if (!$("workedSolutions").classList.contains("hidden")) $("workedSolutions").textContent = solution1() + "\n\n" + solution2();
      break;
    case "teacherMode":
      CONFIG.mode = e.target.value;
      renderUI();
      $("configEditor").value = JSON.stringify(CONFIG, null, 2);
      break;
    case "teacherLanguage":
      CONFIG.language = e.target.value;
      renderUI(); prepareTeacher();
      if (!$("workedSolutions").classList.contains("hidden")) $("workedSolutions").textContent = solution1() + "\n\n" + solution2();
      break;
    case "teacherReadouts":
      CONFIG.showReadouts = e.target.checked;
      updateUI();
      $("configEditor").value = JSON.stringify(CONFIG, null, 2);
      break;
    case "teacherSafe":
      state.teacherSafeOverride = e.target.checked;
      CONFIG.showSafeZone = e.target.checked;
      updateUI();
      $("configEditor").value = JSON.stringify(CONFIG, null, 2);
      break;
  }
});
document.addEventListener("keydown", e => {
  const modal = !$("copyModal").classList.contains("hidden") ? $("copyModal")
    : !$("teacherModal").classList.contains("hidden") ? $("teacherModal") : null;
  if (!modal) return;
  if (e.key === "Escape") {
    if (modal.id === "copyModal") $("closeCopy").click();
    else $("closeTeacher").click();
  }
  if (e.key === "Tab") {
    const items = [...modal.querySelectorAll("button, input, select, textarea, [tabindex]")]
      .filter(el => !el.disabled && el.getClientRects().length > 0);
    if (!items.length) return;
    const first = items[0], last = items[items.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});
$("pinInput").addEventListener("keydown", e => {
  if (e.key === "Enter") $("unlockTeacher").click();
});
window.addEventListener("blur", finishDrag);
document.addEventListener("visibilitychange", () => { state.lastTime = performance.now(); });

validateConfig(CONFIG);
const initialTests = acceptanceTests();
console.assert(initialTests.every(t => t.pass), "Physics acceptance tests failed", initialTests);
canvas.style.minWidth = `${CONFIG.drawing.minimumCanvasWidth}px`;
renderUI();
requestAnimationFrame(frame);
</script>
